<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="@playform DSH Family badges" viewBox="0 0 760 120" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500">
  <!-- ============================================================
       DSH Family @ PlayForm - Badge Sprite
       Shields-style text badges. Blue + white only:
       label segment #003ec7 with #ffffff ink,
       value segment #eef0ff with #0038b6 ink.
       Reference each badge as:
         <use href="/assets/badges.svg#badge-classic"/>
         <use href="/assets/badges.svg#badge-effect-ts"/>
         <use href="/assets/badges.svg#badge-governor"/>
         <use href="/assets/badges.svg#badge-pinner"/>
         <use href="/assets/badges.svg#badge-dash"/> ... etc.
       ============================================================ -->
  <defs>
    <g id="shields-base">
      <!-- shared geometry helpers are per-symbol below -->
    </g>
  </defs>

  <!-- variant | CLASSIC -->
  <symbol id="badge-classic" viewBox="0 0 120 20">
    <clipPath id="badge-classic-clip"><rect width="120" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-classic-clip)">
      <rect width="60" height="20" fill="#003ec7"/>
      <rect x="60" width="60" height="20" fill="#eef0ff"/>
    </g>
    <text x="30" y="14" fill="#ffffff" text-anchor="middle">variant</text>
    <text x="90" y="14" fill="#0038b6" text-anchor="middle">CLASSIC</text>
  </symbol>

  <!-- variant | EFFECT-TS -->
  <symbol id="badge-effect-ts" viewBox="0 0 134 20">
    <clipPath id="badge-effect-ts-clip"><rect width="134" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-effect-ts-clip)">
      <rect width="60" height="20" fill="#003ec7"/>
      <rect x="60" width="74" height="20" fill="#eef0ff"/>
    </g>
    <text x="30" y="14" fill="#ffffff" text-anchor="middle">variant</text>
    <text x="97" y="14" fill="#0038b6" text-anchor="middle">EFFECT-TS</text>
  </symbol>

  <!-- role | GOVERNOR -->
  <symbol id="badge-governor" viewBox="0 0 106 20">
    <clipPath id="badge-governor-clip"><rect width="106" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-governor-clip)">
      <rect width="40" height="20" fill="#003ec7"/>
      <rect x="40" width="66" height="20" fill="#eef0ff"/>
    </g>
    <text x="20" y="14" fill="#ffffff" text-anchor="middle">role</text>
    <text x="73" y="14" fill="#0038b6" text-anchor="middle">GOVERNOR</text>
  </symbol>

  <!-- role | PINNER -->
  <symbol id="badge-pinner" viewBox="0 0 94 20">
    <clipPath id="badge-pinner-clip"><rect width="94" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-pinner-clip)">
      <rect width="40" height="20" fill="#003ec7"/>
      <rect x="40" width="54" height="20" fill="#eef0ff"/>
    </g>
    <text x="20" y="14" fill="#ffffff" text-anchor="middle">role</text>
    <text x="67" y="14" fill="#0038b6" text-anchor="middle">PINNER</text>
  </symbol>

  <!-- flavor | DASH -->
  <symbol id="badge-dash" viewBox="0 0 94 20">
    <clipPath id="badge-dash-clip"><rect width="94" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-dash-clip)">
      <rect width="54" height="20" fill="#003ec7"/>
      <rect x="54" width="40" height="20" fill="#eef0ff"/>
    </g>
    <text x="27" y="14" fill="#ffffff" text-anchor="middle">flavor</text>
    <text x="74" y="14" fill="#0038b6" text-anchor="middle">DASH</text>
  </symbol>

  <!-- flavor | QUOTES -->
  <symbol id="badge-quotes" viewBox="0 0 108 20">
    <clipPath id="badge-quotes-clip"><rect width="108" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-quotes-clip)">
      <rect width="54" height="20" fill="#003ec7"/>
      <rect x="54" width="54" height="20" fill="#eef0ff"/>
    </g>
    <text x="27" y="14" fill="#ffffff" text-anchor="middle">flavor</text>
    <text x="81" y="14" fill="#0038b6" text-anchor="middle">QUOTES</text>
  </symbol>

  <!-- flavor | ELLIPSIS -->
  <symbol id="badge-ellipsis" viewBox="0 0 120 20">
    <clipPath id="badge-ellipsis-clip"><rect width="120" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-ellipsis-clip)">
      <rect width="54" height="20" fill="#003ec7"/>
      <rect x="54" width="66" height="20" fill="#eef0ff"/>
    </g>
    <text x="27" y="14" fill="#ffffff" text-anchor="middle">flavor</text>
    <text x="87" y="14" fill="#0038b6" text-anchor="middle">ELLIPSIS</text>
  </symbol>

  <!-- flavor | SPACES -->
  <symbol id="badge-spaces" viewBox="0 0 108 20">
    <clipPath id="badge-spaces-clip"><rect width="108" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-spaces-clip)">
      <rect width="54" height="20" fill="#003ec7"/>
      <rect x="54" width="54" height="20" fill="#eef0ff"/>
    </g>
    <text x="27" y="14" fill="#ffffff" text-anchor="middle">flavor</text>
    <text x="81" y="14" fill="#0038b6" text-anchor="middle">SPACES</text>
  </symbol>

  <!-- flavor | INVISIBLE -->
  <symbol id="badge-invisible" viewBox="0 0 128 20">
    <clipPath id="badge-invisible-clip"><rect width="128" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-invisible-clip)">
      <rect width="54" height="20" fill="#003ec7"/>
      <rect x="54" width="74" height="20" fill="#eef0ff"/>
    </g>
    <text x="27" y="14" fill="#ffffff" text-anchor="middle">flavor</text>
    <text x="91" y="14" fill="#0038b6" text-anchor="middle">INVISIBLE</text>
  </symbol>

  <!-- flavor | FULLWIDTH -->
  <symbol id="badge-fullwidth" viewBox="0 0 128 20">
    <clipPath id="badge-fullwidth-clip"><rect width="128" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-fullwidth-clip)">
      <rect width="54" height="20" fill="#003ec7"/>
      <rect x="54" width="74" height="20" fill="#eef0ff"/>
    </g>
    <text x="27" y="14" fill="#ffffff" text-anchor="middle">flavor</text>
    <text x="91" y="14" fill="#0038b6" text-anchor="middle">FULLWIDTH</text>
  </symbol>

  <!-- flavor | FILE -->
  <symbol id="badge-file" viewBox="0 0 94 20">
    <clipPath id="badge-file-clip"><rect width="94" height="20" rx="2"/></clipPath>
    <g clip-path="url(#badge-file-clip)">
      <rect width="54" height="20" fill="#003ec7"/>
      <rect x="54" width="40" height="20" fill="#eef0ff"/>
    </g>
    <text x="27" y="14" fill="#ffffff" text-anchor="middle">flavor</text>
    <text x="74" y="14" fill="#0038b6" text-anchor="middle">FILE</text>
  </symbol>
</svg>
