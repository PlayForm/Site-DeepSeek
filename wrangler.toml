# Cloudflare Pages configuration for the @playform / DSH Family site.
#
# This site is a fully static Astro build: point Cloudflare Pages at this repo
# and set (or rely on the values below):
#
#   Build command:        pnpm run prepublishOnly
#   Build output dir:     Target/
#   Framework preset:     None (static)
#
# The build emits Target/ with directory-style routes (index.html,
# plugins/index.html, ...), which Cloudflare Pages serves natively.

name = "playform-dsh-family"

# The directory the built site is served from.
pages_build_output_dir = "Target"

# Pages build settings (used by Cloudflare Pages' build system).
[build]
command = "pnpm run prepublishOnly"

[vars]
NODE_VERSION = "26"
